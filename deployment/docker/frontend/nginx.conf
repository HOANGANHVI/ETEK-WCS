# ETEK WCS - Nginx: static UI + reverse proxy to the backend container (API and SignalR WebSocket).
upstream wcs_backend { server backend:8080; keepalive 16; }

# SignalR: upgrade to WebSocket only when the client asks for it
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }

    # REST API
    location /api/ {
        proxy_pass http://wcs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR hub (WebSocket, falls back to SSE / long polling)
    location /hubs/ {
        proxy_pass http://wcs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Anonymous health probe (application + database state, no data)
    location = /healthz { proxy_pass http://wcs_backend; proxy_http_version 1.1; proxy_set_header Connection ""; access_log off; }

    # Hashed build assets are immutable
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # React Router: any other path returns the app shell (page refresh / deep links)
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
